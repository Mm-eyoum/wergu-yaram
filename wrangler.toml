# Cloudflare Worker — proxy wildcard des sous-domaines partenaires.
#
# NE déploie PAS le SPA (qui reste sur Firebase Hosting) : ce worker se contente
# de proxifier `*.werguyaram.org` → `werguyaram.web.app` (cf. le script `main`).
#
# Déploiement (depuis la racine du repo, compte Cloudflare connecté) :
#   npx wrangler deploy
#
# ⚠️ Ne PAS utiliser un build « Vite/Framework » Cloudflare pour ce worker :
# build command = (vide). La route ci-dessous est créée automatiquement.
name = "werguyaram-wildcard"
main = "infra/cloudflare/wildcard-worker.js"
compatibility_date = "2024-11-01"

routes = [
  { pattern = "*.werguyaram.org/*", zone_name = "werguyaram.org" },
]
